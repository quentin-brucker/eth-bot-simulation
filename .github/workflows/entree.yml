name: Test entrée immédiate

on:
  workflow_dispatch:          # lancé à la main depuis l'onglet Actions

permissions:
  contents: write

jobs:
  entree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Installer la bibliothèque
        run: pip install -r requirements.txt

      - name: Comparer entrée immédiate et signal
        run: python entree.py

      - name: Enregistrer le résultat
        run: |
          cat ENTREE.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "bot-simulation"
          git config user.email "bot-simulation@users.noreply.github.com"
          git add ENTREE.md
          git diff --cached --quiet || git commit -m "Test entrée immédiate"
          git pull --rebase
          git push
